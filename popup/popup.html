<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coupons Vault</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <h1 class="header__title">Coupons Vault</h1>
    <button id="btn-add" class="btn btn--primary btn--sm">+ Add</button>
  </header>

  <!-- Add/Edit form (hidden by default) -->
  <section id="form-section" class="form-section hidden">
    <form id="coupon-form">
      <div class="form-group">
        <label for="f-brand">Brand *</label>
        <input type="text" id="f-brand" name="brand" required placeholder="e.g. Zalando" />
      </div>
      <div class="form-group">
        <label for="f-code">Code *</label>
        <input type="text" id="f-code" name="code" required placeholder="e.g. SAVE20" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="f-discount-value">Value</label>
          <input type="number" id="f-discount-value" name="discountValue" min="0" step="0.01" placeholder="20" />
        </div>
        <div class="form-group">
          <label for="f-discount-type">Type</label>
          <select id="f-discount-type" name="discountType">
            <option value="percentage">%</option>
            <option value="flat">Flat</option>
            <option value="freeShipping">Free Shipping</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="f-expiry">Expiry Date</label>
        <input type="date" id="f-expiry" name="expiryDate" />
      </div>
      <div class="form-group">
        <label for="f-min-purchase">Min. Purchase</label>
        <input type="number" id="f-min-purchase" name="minPurchase" min="0" step="0.01" placeholder="Optional" />
      </div>
      <div class="form-group">
        <label for="f-terms">Terms</label>
        <textarea id="f-terms" name="terms" rows="2" placeholder="Optional"></textarea>
      </div>
      <div class="form-group">
        <label for="f-brand-urls">Brand URL(s)</label>
        <input type="text" id="f-brand-urls" name="brandUrls" placeholder="e.g. amazon.de, amazon.com" />
      </div>
      <div class="form-actions">
        <button type="button" id="btn-cancel" class="btn btn--ghost">Cancel</button>
        <button type="submit" id="btn-save" class="btn btn--primary">Save</button>
      </div>
    </form>
  </section>

  <!-- Filter bar: shown when popup is on a matching site -->
  <div id="filter-bar" class="filter-bar hidden">
    <span id="filter-label"></span>
    <button id="btn-show-all" class="btn btn--ghost btn--sm">Show all</button>
  </div>

  <!-- Coupon list -->
  <section id="list-section">
    <div id="coupon-list"></div>
    <p id="empty-state" class="empty-state hidden">No coupons yet. Hit "+ Add" to add one.</p>
  </section>

  <!-- Import status message -->
  <p id="import-status" class="import-status hidden"></p>

  <!-- Footer actions -->
  <footer class="footer">
    <button id="btn-export" class="btn btn--ghost btn--sm">Export CSV</button>
    <label class="btn btn--ghost btn--sm" for="import-file">Import CSV</label>
    <input type="file" id="import-file" accept=".csv" class="sr-only" />
  </footer>

  <script src="../lib/storage.js"></script>
  <script src="../lib/matcher.js"></script>
  <script src="../lib/csv.js"></script>
  <script src="popup.js"></script>
</body>
</html>
